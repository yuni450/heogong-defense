<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>허공수비대</title>
<link rel="stylesheet" href="style.css">
<style>
/* 종목·구단 선택과 전용 장비 확장의 A 담당 통합 스타일 */
#league-tabs { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 0 0 14px; }
#league-tabs button { min-width: 0; padding: 12px 4px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.06); font-size: 14px; font-weight: 800; white-space: nowrap; }
#league-tabs button.on { color: #fff; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 24%, #131a2c); }
#teams { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
#teams .opt { min-width: 0; display: flex; align-items: center; gap: 7px; padding: 10px 8px; border-width: 1px; border-radius: 12px; text-align: left; }
#teams .club-ball { flex: 0 0 28px; width: 28px; height: 28px; }
#teams .nm { margin: 0; font-size: 13px; line-height: 1.35; word-break: keep-all; }
#s-team .card { padding: 20px 14px; }
#s-team h2 { margin-bottom: 12px; }
#btn-team-back { padding: 10px; font-size: 13px; }
.hud-club-row { align-items: center; gap: 6px; }
#hud-team { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 12px; padding: 7px 10px; }
#btn-change-team { pointer-events: auto; flex: 0 0 auto; width: auto; padding: 7px 10px; color: var(--ink); font-size: 12px; }
#toolbar button { min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
#toolbar button:focus-visible, #league-tabs button:focus-visible, #teams button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
@media (max-width: 350px) {
  #s-team .card { padding: 16px 10px; }
  #teams .opt { padding: 9px 5px; gap: 4px; }
  #teams .nm { font-size: 12px; }
  #toolbar { gap: 4px; }
  #toolbar button { font-size: 11px; padding-inline: 2px; }
}
</style>
</head>
<body>
<video id="cam" playsinline muted autoplay></video>
<canvas id="game"></canvas>

<div id="ui">
  <!-- 1. 시험 접수 -->
  <section id="s-intro" class="screen active">
    <div class="card">
      <div class="badge">국가공인*</div>
      <h1>🏀 허공수비대</h1>
      <p class="sub">허공 수비 자격시험</p>
      <p class="quote">“선수들은 코트에서 수비하고,<br>우리는 관중석에서 수비한다!”</p>
      <label class="field">응시자 이름
        <input id="name" maxlength="10" placeholder="이름을 입력하세요" autocomplete="off">
      </label>
      <button id="btn-apply" class="primary">시험 접수하기</button>
      <p id="best" class="fine"></p>
      <p class="fine">카메라로 경기장이나 TV를 비춰 주세요.<br>* 유머를 위한 가상 설정이며 실제 공인 자격증이 아닙니다.</p>
    </div>
  </section>

  <!-- 2. 응원팀 선택 -->
  <section id="s-team" class="screen">
    <div class="card">
      <p class="step">STEP 1</p>
      <h2>응원팀 선택</h2>
      <div id="league-tabs" role="tablist" aria-label="종목 선택">
        <button id="tab-kbl" type="button" role="tab" data-league="kbl" aria-selected="true" aria-controls="teams">🏀 농구 KBL</button>
        <button id="tab-kbo" type="button" role="tab" data-league="kbo" aria-selected="false" aria-controls="teams">⚾ 야구 KBO</button>
      </div>
      <div id="teams" class="grid" role="tabpanel" aria-labelledby="tab-kbl"></div>
      <button id="btn-team-back" class="ghost">이름 입력으로</button>
    </div>
  </section>

  <!-- 3. 실기시험 HUD: 카메라 화면 위 오버레이 -->
  <section id="s-hud" class="screen hud">
    <div class="hud-top">
      <div class="hud-row hud-club-row">
        <div id="hud-team" class="pill"></div>
        <button id="btn-change-team" class="pill">구단 변경</button>
      </div>
      <div class="hud-row">
        <div id="hud-round" class="pill"></div>
        <div id="hud-score" class="pill strong">0점</div>
      </div>
      <div id="meter" class="meter">
        <div class="meter-label"><span id="meter-text">방해력</span><span id="meter-time"></span></div>
        <div class="bar"><div id="meter-fill" class="fill"></div><div class="line"></div></div>
        <div class="bar thin"><div id="time-fill" class="fill time"></div></div>
      </div>
    </div>
    <div class="hud-bottom">
      <div id="hud-hint" class="hud-hint"></div>
      <button id="btn-shot" class="shot-btn">🏀 자유투!</button>
      <div id="toolbar" class="toolbar"></div>
    </div>
    <div id="shot-outcome" class="outcome-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="outcome-title">
      <div class="outcome-card">
        <p class="step">실제 자유투 결과 확인</p>
        <h2 id="outcome-title">공이 들어갔나요?</h2>
        <p class="outcome-detail">방해력 측정이 완료되었습니다. 실제 슛 결과를 선택해주세요.</p>
        <div class="outcome-buttons">
          <button type="button" data-made="yes" class="outcome-made">🏀 들어갔다</button>
          <button type="button" data-made="no" class="outcome-missed">🛡️ 안 들어갔다</button>
        </div>
        <p class="fine">카메라가 득점을 자동 판별하지 않으므로 직접 선택합니다.</p>
      </div>
    </div>
  </section>

  <!-- 4. 성적표 -->
  <section id="s-result" class="screen">
    <div class="card">
      <p class="step">허공 수비 실기시험 성적표</p>
      <div id="res-grade" class="grade"></div>
      <dl id="stats" class="stats"></dl>
      <ol id="rounds" class="rounds"></ol>
      <p id="cert-status" class="cert-status" aria-live="polite"></p>
      <button id="btn-cert" class="primary">자격증 발급받기</button>
      <button id="btn-retry" class="ghost">같은 구단으로 재응시</button>
      <button id="btn-result-team" class="ghost">다른 구단 선택</button>
      <button id="btn-new-player" class="ghost">새 참가자 접수</button>
    </div>
  </section>

  <!-- 5. 자격증 -->
  <section id="s-cert" class="screen">
    <div class="card cert-card">
      <img id="cert-img" alt="허공 수비 자격증">
      <div class="row">
        <a id="btn-save" class="primary" download="허공수비_자격증.png">이미지 저장</a>
        <button id="btn-share" class="ghost">공유하기</button>
      </div>
      <button id="btn-home" class="ghost">처음으로</button>
    </div>
  </section>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
